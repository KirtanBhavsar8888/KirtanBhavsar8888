steps:
  # Checks repo under $GITHUB_WORKSHOP, so your job can access it
  - uses: actions/checkout@v2

  # Generates the snake
  - uses: Platane/snk@master
    id: snake-gif
    with:
      github_user_name: KirtanBhavsar8888
      # These lines generate the files on a branch called "output". This keeps the main branch from cluttering up.
      gif_out_path: dist/github-contribution-grid-snake.gif
      svg_out_path: dist/github-contribution-grid-snake.svg

  # Show the status of the build for debugging purposes
  - run: git status

  # Push the changes
  - name: Push changes
    uses: ad-m/github-push-action@master
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      branch: master
      force: true

  # Deploy the snake output to the output branch
  - uses: crazy-max/ghaction-github-pages@v2.1.3
    with:
      target_branch: output
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
